<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MagnaVERSE Slides</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0E13;--surface:#131820;--surface-2:#1A202A;--surface-3:#222935;
  --tx:#F2F3F6;--tx-2:#B4B9C6;--tx-3:#787E8D;--tx-4:#4C5262;
  --accent:#D71920;--cyan:#0EA5B7;--private:#3FCF95;--r:10px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--sans)}
#app{display:flex;flex-direction:column;height:100vh}
.toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);
  border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.toolbar h1{font-size:14px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.toolbar h1 svg{width:18px;height:18px;stroke:var(--cyan);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.toolbar .sep{width:1px;height:20px;background:rgba(255,255,255,.1)}
.toolbar button{padding:5px 12px;border-radius:6px;font-size:12px;color:var(--tx-2);background:transparent;
  border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:all .15s}
.toolbar button:hover{background:rgba(255,255,255,.06);color:var(--tx);border-color:rgba(255,255,255,.15)}
.toolbar button.primary{background:var(--cyan);color:#000;border-color:var(--cyan);font-weight:600}
.toolbar button.primary:hover{background:#12B5C9}
.main{flex:1;display:flex;min-height:0}
.sidebar{width:200px;flex:none;background:var(--surface);border-right:1px solid rgba(255,255,255,.08);
  overflow-y:auto;padding:10px}
.slide-thumb{border-radius:8px;border:2px solid transparent;cursor:pointer;margin-bottom:8px;
  overflow:hidden;transition:border-color .15s;position:relative;aspect-ratio:16/9;background:var(--surface-2)}
.slide-thumb:hover{border-color:rgba(255,255,255,.2)}
.slide-thumb.active{border-color:var(--cyan)}
.slide-thumb .num{position:absolute;bottom:4px;left:6px;font-size:10px;color:var(--tx-3);
  background:rgba(0,0,0,.5);padding:1px 5px;border-radius:4px;font-family:var(--mono)}
.slide-thumb .preview{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--tx-3);padding:6px;text-align:center}
.canvas-area{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.slide-canvas{width:640px;height:360px;background:var(--surface-2);border-radius:8px;
  box-shadow:0 12px 40px rgba(0,0,0,.4);position:relative;overflow:hidden}
.slide-content{position:absolute;inset:0;padding:40px 48px;display:flex;flex-direction:column;justify-content:center}
.slide-title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.slide-subtitle{font-size:16px;color:var(--tx-2);line-height:1.5}
.slide-bullets{list-style:none;padding:0;margin-top:16px}
.slide-bullets li{font-size:14px;color:var(--tx-2);padding:6px 0;display:flex;align-items:center;gap:8px}
.slide-bullets li::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--cyan);flex:none}
.slide-accent{position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--cyan),var(--accent))}
.props{width:220px;flex:none;background:var(--surface);border-left:1px solid rgba(255,255,255,.08);
  padding:14px;overflow-y:auto}
.props h4{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx-4);margin-bottom:8px}
.props label{display:block;font-size:11px;color:var(--tx-3);margin-bottom:4px;margin-top:10px}
.props input,.props select{width:100%;padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.08);
  background:var(--surface-2);color:var(--tx);font-size:12px;outline:none}
.props input:focus{border-color:var(--cyan)}
</style>
</head>
<body>
<div id="app">
  <div class="toolbar">
    <h1>
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/></svg>
      MagnaVERSE Slides
    </h1>
    <div class="sep"></div>
    <button onclick="addSlide()">+ Slide</button>
    <button onclick="exportPptx()" class="primary">Export .pptx</button>
    <div style="flex:1"></div>
    <span style="font-size:11px;color:var(--tx-3);font-family:var(--mono)">PptxGenJS · MIT</span>
  </div>
  <div class="main">
    <div class="sidebar" id="slideList"></div>
    <div class="canvas-area">
      <div class="slide-canvas" id="slideCanvas"></div>
    </div>
    <div class="props" id="propsPanel">
      <h4>Slide Properties</h4>
      <label>Title</label>
      <input id="propTitle" oninput="updateSlide()" placeholder="Slide title"/>
      <label>Subtitle</label>
      <input id="propSubtitle" oninput="updateSlide()" placeholder="Slide subtitle"/>
      <label>Bullet points (one per line)</label>
      <textarea id="propBullets" oninput="updateSlide()" rows="6" style="width:100%;padding:6px 10px;border-radius:6px;
        border:1px solid rgba(255,255,255,.08);background:var(--surface-2);color:var(--tx);font-size:12px;
        outline:none;font-family:var(--sans);resize:vertical"></textarea>
      <label>Background color</label>
      <input id="propBg" type="color" value="#1A202A" oninput="updateSlide()"/>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS/dist/pptxgen.bundle.js"></script>
<script>
var slides = [
  {title:"MagnaVERSE",subtitle:"Enterprise AI Workspace",bullets:["Sovereign AI inference","On-prem deployment","Zero egress guarantee"],bg:"#1A202A"},
  {title:"Package C2 Status",subtitle:"RYD-M3 · Rebar Delivery",bullets:["1,240 t ordered · 742 t delivered","SAR 5.32M exposure at 45 days","11 days behind critical path"],bg:"#1A202A"},
  {title:"Recommendation",subtitle:"Dual-source rebar procurement",bullets:["Split order across 2 vendors","Accept 1.8% unit-rate premium","Recover 14 days on rebar chain"],bg:"#1A202A"}
];
var current = 0;
function renderSidebar(){
  document.getElementById("slideList").innerHTML = slides.map(function(s,i){
    return '<div class="slide-thumb'+(i===current?" active":"")+'" onclick="selectSlide('+i+')">'+
      '<div class="preview">'+esc(s.title)+'</div>'+
      '<span class="num">'+(i+1)+'</span></div>';
  }).join("");
}
function renderCanvas(){
  var s = slides[current];
  document.getElementById("slideCanvas").style.background = s.bg;
  document.getElementById("slideCanvas").innerHTML =
    '<div class="slide-content">'+
      '<div class="slide-title">'+esc(s.title)+'</div>'+
      '<div class="slide-subtitle">'+esc(s.subtitle)+'</div>'+
      (s.bullets.length ? '<ul class="slide-bullets">'+s.bullets.map(function(b){return '<li>'+esc(b)+'</li>'}).join("")+'</ul>' : '')+
    '</div><div class="slide-accent"></div>';
  document.getElementById("propTitle").value = s.title;
  document.getElementById("propSubtitle").value = s.subtitle;
  document.getElementById("propBullets").value = s.bullets.join("\n");
  document.getElementById("propBg").value = s.bg;
}
function selectSlide(i){ current = i; renderSidebar(); renderCanvas(); }
function updateSlide(){
  slides[current].title = document.getElementById("propTitle").value;
  slides[current].subtitle = document.getElementById("propSubtitle").value;
  slides[current].bullets = document.getElementById("propBullets").value.split("\n").filter(function(l){return l.trim()});
  slides[current].bg = document.getElementById("propBg").value;
  renderSidebar(); renderCanvas();
}
function addSlide(){
  slides.push({title:"New Slide",subtitle:"",bullets:[],bg:"#1A202A"});
  current = slides.length - 1;
  renderSidebar(); renderCanvas();
}
function exportPptx(){
  var pres = new PptxGenJS();
  pres.layout = "LAYOUT_WIDE";
  slides.forEach(function(s){
    var slide = pres.addSlide();
    slide.background = {color: s.bg.replace("#","")};
    slide.addText(s.title, {x:0.8,y:0.8,w:8.4,h:1.2,fontSize:32,fontFace:"Arial",color:"F2F3F6",bold:true});
    slide.addText(s.subtitle, {x:0.8,y:2.0,w:8.4,h:0.6,fontSize:16,fontFace:"Arial",color:"B4B9C6"});
    if(s.bullets.length){
      slide.addText(s.bullets.map(function(b){return {text:b,options:{fontSize:14,color:"B4B3C6",bullet:{code:"2022"}}}}),
        {x:0.8,y:2.8,w:8.4,h:4,fontFace:"Arial",lineSpacingMultiple:1.3});
    }
    slide.addShape(pres.ShapeType.rect, {x:0,y:7.3,w:"100%",h:0.06,fill:{color:"0EA5B7"}});
  });
  pres.writeFile({fileName:"MagnaVERSE-Slides.pptx"});
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
renderSidebar(); renderCanvas();
</script>
</body>
</html>
