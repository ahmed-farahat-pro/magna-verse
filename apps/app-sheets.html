<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MagnaVERSE Sheets</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckyexcel@latest/dist/plugins/css/luckyexcel.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0E13;--surface:#131820;--tx:#F2F3F6;--tx-2:#B4B9C6;--tx-3:#787E8D;--accent:#D71920;
  --cyan:#0EA5B7;--r:10px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--sans)}
#app{display:flex;flex-direction:column;height:100vh}
.toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);
  border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.toolbar h1{font-size:14px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.toolbar h1 svg{width:18px;height:18px;stroke:var(--cyan);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.toolbar .sep{width:1px;height:20px;background:rgba(255,255,255,.1)}
.toolbar button{padding:5px 12px;border-radius:6px;font-size:12px;color:var(--tx-2);background:transparent;
  border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:all .15s}
.toolbar button:hover{background:rgba(255,255,255,.06);color:var(--tx);border-color:rgba(255,255,255,.15)}
.toolbar button.primary{background:var(--cyan);color:#000;border-color:var(--cyan);font-weight:600}
.toolbar button.primary:hover{background:#12B5C9}
.sheet-wrap{flex:1;min-height:0;overflow:hidden}
#luckyexcel_map{width:100%;height:100%}
/* Override Luckysheet dark theme */
.luckyexcel_father{background:var(--bg)!important;color:var(--tx)!important}
.ht_master table{color:var(--tx)!important}
</style>
</head>
<body>
<div id="app">
  <div class="toolbar">
    <h1>
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
      MagnaVERSE Sheets
    </h1>
    <div class="sep"></div>
    <button onclick="exportXlsx()">Export .xlsx</button>
    <button onclick="luckysheetluckysheet.refresh()">Refresh</button>
    <div style="flex:1"></div>
    <span style="font-size:11px;color:var(--tx-3);font-family:var(--mono)">Luckysheet · MIT</span>
  </div>
  <div class="sheet-wrap">
    <div id="luckyexcel_map"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/luckyexcel@latest/dist/plugins/js/luckyexcel.umd.js"></script>
<script>
var luckysheetluckysheet;
window.onload = function(){
  luckysheetluckysheet = luckysheet.create({
    container: "luckyexcel_map",
    title: "MagnaVERSE Sheets",
    lang: "en",
    showinfobar: false,
    data: [{name:"Sheet1",celldata:[], order:0, status:1}],
    allowEdit: true,
    hook: {
      cellEditBefore: function(){ return true; }
    }
  });
};
function exportXlsx(){
  if(!luckysheetluckysheet) return;
  luckysheetluckysheet.exportXlsx({
    fileName: "MagnaVERSE-Sheets.xlsx"
  });
}
</script>
</body>
</html>
