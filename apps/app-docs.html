<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MagnaVERSE Docs</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0E13;--surface:#131820;--surface-2:#1A202A;--tx:#F2F3F6;--tx-2:#B4B9C6;--tx-3:#787E8D;
  --tx-4:#4C5262;--accent:#D71920;--cyan:#0EA5B7;--r:10px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--sans)}
#app{display:flex;flex-direction:column;height:100vh}
.toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);
  border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.toolbar h1{font-size:14px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.toolbar h1 svg{width:18px;height:18px;stroke:var(--cyan);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.toolbar .sep{width:1px;height:20px;background:rgba(255,255,255,.1)}
.toolbar button{padding:5px 12px;border-radius:6px;font-size:12px;color:var(--tx-2);background:transparent;
  border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:all .15s}
.toolbar button:hover{background:rgba(255,255,255,.06);color:var(--tx);border-color:rgba(255,255,255,.15)}
.toolbar button.primary{background:var(--cyan);color:#000;border-color:var(--cyan);font-weight:600}
.toolbar button.primary:hover{background:#12B5C9}
.editor-wrap{flex:1;min-height:0;overflow-y:auto;display:flex;justify-content:center;padding:32px 20px}
#editorjs{width:100%;max-width:720px}
/* Editor.js dark theme overrides */
.codex-editor__redactor{padding-bottom:100px!important}
.ce-block__content{max-width:100%!important}
.ce-toolbar__content{max-width:100%!important}
.ce-header{color:var(--tx)!important}
.cdx-block{color:var(--tx-2)!important}
.ce-paragraph{color:var(--tx-2)!important;line-height:1.7}
.ce-toolbar__plus,.ce-toolbar__settings-btn{color:var(--tx-3)!important;background:var(--surface-2)!important;
  border:1px solid rgba(255,255,255,.08)!important;border-radius:6px!important}
.ce-toolbar__plus:hover,.ce-toolbar__settings-btn:hover{background:rgba(255,255,255,.1)!important;color:var(--tx)!important}
.ce-inline-toolbar{background:var(--surface)!important;border:1px solid rgba(255,255,255,.1)!important;
  border-radius:8px!important;box-shadow:0 8px 24px rgba(0,0,0,.4)!important}
.ce-inline-tool{color:var(--tx-2)!important}
.ce-inline-tool:hover{color:var(--cyan)!important}
.ce-conversion-toolbar{background:var(--surface)!important;border:1px solid rgba(255,255,255,.1)!important;
  border-radius:8px!important}
.ce-conversion-tool{color:var(--tx-2)!important}
.ce-conversion-tool:hover{color:var(--cyan)!important}
.ce-settings__button{color:var(--tx-2)!important}
.ce-settings__button:hover{background:rgba(255,255,255,.06)!important;color:var(--tx)!important}
.ce-popover{background:var(--surface)!important;border:1px solid rgba(255,255,255,.1)!important;
  border-radius:10px!important;box-shadow:0 12px 32px rgba(0,0,0,.5)!important}
.ce-popover-item__title{color:var(--tx-2)!important}
.ce-popover-item:hover{background:rgba(255,255,255,.06)!important}
.ce-popover-item--active{background:rgba(14,165,183,.12)!important}
.ce-inline-block{background:var(--surface-2)!important;border:1px solid rgba(255,255,255,.08)!important;
  border-radius:8px!important}
.cdx-marker{background:rgba(14,165,183,.2)!important;color:var(--tx)!important}
blockquote{border-left:3px solid var(--cyan)!important;color:var(--tx-2)!important;padding-left:16px}
.code-block{background:var(--surface-2)!important;border:1px solid rgba(255,255,255,.08)!important;
  border-radius:8px!important;padding:12px 16px!important;font-family:var(--mono)!important;
  font-size:13px!important;color:var(--tx-2)!important}
.delimiter{color:var(--tx-4)!important}
</style>
</head>
<body>
<div id="app">
  <div class="toolbar">
    <h1>
      <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h4"/></svg>
      MagnaVERSE Docs
    </h1>
    <div class="sep"></div>
    <button onclick="saveDoc()">Save</button>
    <button onclick="exportHTML()">Export HTML</button>
    <button onclick="exportMD()">Export Markdown</button>
    <div style="flex:1"></div>
    <span id="status" style="font-size:11px;color:var(--tx-3);font-family:var(--mono)">Ready</span>
  </div>
  <div class="editor-wrap">
    <div id="editorjs"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/list@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/paragraph@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/inline-code@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/simple-image@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@latest"></script>
<script>
var editor;
window.onload = function(){
  editor = new EditorJS({
    holder: "editorjs",
    placeholder: "Start writing your document...",
    tools: {
      header: { class: Header, config: { levels: [1,2,3,4], defaultLevel: 2 } },
      list: { class: List, inlineToolbar: true },
      marker: { class: Marker },
      inlineCode: { class: InlineCode },
      delimiter: { class: Delimiter },
      table: { class: Table, inlineToolbar: true },
      image: { class: SimpleImage, config: { placeholder: "Paste image URL..." } }
    },
    data: {
      blocks: [
        {type:"header",data:{text:"Project Status Report",level:1}},
        {type:"paragraph",data:{text:"This document outlines the current status of Package C2 rebar delivery and the associated exposure calculations. All figures are sourced from SAP S/4HANA and Primavera P6."}},
        {type:"header",data:{text:"Key Metrics",level:2}},
        {type:"table",data:{withHeadings:true,content:[
          ["Metric","Value","Status"],
          ["Ordered","1,240 t","—"],
          ["Delivered","742 t","Behind"],
          ["Exposure","SAR 5.32M","Critical"],
          ["Days late","11","On critical path"]
        ]}},
        {type:"delimiter",data:{}},
        {type:"header",data:{text:"Recommendation",level:2}},
        {type:"paragraph",data:{text:"Split the rebar order across two vendors. The single-source risk on Al-Rajhi exceeds the unit-rate penalty of dual-sourcing by SAR 280K."}},
        {type:"list",data:{style:"unordered",items:["Approve dual-source procurement","Notify Al-Rajhi of order reduction","Update Baseline r7 in P6"]}}
      ]
    },
    onReady: function(){ document.getElementById("status").textContent = "Loaded"; }
  });
};
function saveDoc(){
  editor.save().then(function(data){
    document.getElementById("status").textContent = "Saved at " + new Date().toLocaleTimeString();
    localStorage.setItem("magnaverse-doc", JSON.stringify(data));
  });
}
function exportHTML(){
  editor.save().then(function(data){
    var html = "<!DOCTYPE html><html><head><title>MagnaVERSE Doc</title></head><body>";
    data.blocks.forEach(function(b){
      if(b.type==="header") html += "<h"+b.data.level+">"+b.data.text+"</h"+b.data.level+">";
      else if(b.type==="paragraph") html += "<p>"+b.data.text+"</p>";
      else if(b.type==="list"){
        var tag = b.data.style==="ordered" ? "ol" : "ul";
        html += "<"+tag+">"+b.data.items.map(function(i){return "<li>"+i+"</li>"}).join("")+"</"+tag+">";
      }
    });
    html += "</body></html>";
    var blob = new Blob([html],{type:"text/html"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "magnaverse-doc.html"; a.click();
  });
}
function exportMD(){
  editor.save().then(function(data){
    var md = "";
    data.blocks.forEach(function(b){
      if(b.type==="header") md += "#".repeat(b.data.level)+" "+b.data.text+"\n\n";
      else if(b.type==="paragraph") md += b.data.text+"\n\n";
      else if(b.type==="list"){
        b.data.items.forEach(function(i){md+= "- "+i+"\n"});
        md += "\n";
      }
    });
    var blob = new Blob([md],{type:"text/markdown"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "magnaverse-doc.md"; a.click();
  });
}
</script>
</body>
</html>
