<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagnaVERSE — Theme Picker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Roboto+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#06060a;color:#f2f3f6;overflow-x:hidden}
.hero{padding:48px 40px 32px;text-align:center;background:radial-gradient(ellipse at 50% 0%,rgba(14,165,183,.06),transparent 60%)}
.hero h1{font-size:36px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.hero h1 span{background:linear-gradient(135deg,#0EA5B7,#43E0A6,#7C6BFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:14px;color:#888;max-width:520px;margin:0 auto}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:24px;padding:16px 40px 60px;max-width:1600px;margin:0 auto}
.pcard{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.015);cursor:pointer;transition:all .25s}
.pcard:hover{transform:translateY(-6px);box-shadow:0 16px 48px rgba(0,0,0,.5);border-color:rgba(255,255,255,.1)}
.pcard-head{padding:16px 18px 10px;display:flex;align-items:center;gap:12px}
.pcard-num{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.pcard-info h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
.pcard-info p{font-size:11px;color:#888;margin-top:1px}
.pcard-tags{display:flex;gap:5px;padding:0 18px 10px;flex-wrap:wrap}
.ptag{font-size:9.5px;padding:2px 7px;border-radius:99px;font-weight:500;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);color:#999}

/* ===== SHARED DESKTOP ===== */
.desk{width:100%;height:520px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.bar{height:26px;display:flex;align-items:center;padding:0 10px;gap:10px;flex-shrink:0;z-index:10}
.bar .d{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.bar .d.r{background:#FF5F57}.bar .d.y{background:#FEBC2E}.bar .d.g{background:#28C840}
.bar .aname{font-size:10px;font-weight:600}
.bar .sp{flex:1}
.bar .mi{display:flex;gap:10px}
.bar .mi span{font-size:9.5px;opacity:.4}
.bar .sr{display:flex;gap:8px;align-items:center}
.bar .sr span{font-size:9px;opacity:.35}
.body{flex:1;display:flex;position:relative;overflow:hidden}
.icons{flex:1;padding:16px;position:relative}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,76px);gap:8px;align-content:start}
.ic{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.ic:hover{transform:translateY(-2px)}
.icb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;transition:transform .15s}
.icb svg{width:20px;height:20px}
.icl{font-size:9.5px;text-align:center;line-height:1.2;opacity:.6}
.wpanel{width:240px;flex-shrink:0;padding:14px 12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.wg{border-radius:12px;padding:14px;position:relative;overflow:hidden}
.wg .wh{display:flex;align-items:center;gap:5px;margin-bottom:8px}
.wg .wh svg{width:12px;height:12px}
.wg .wh span{font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;opacity:.5}
.wg .wb{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.wg .ws{font-size:10px;margin-top:3px;line-height:1.4;opacity:.4}
.wg .wbr{height:3px;border-radius:2px;margin-top:8px;overflow:hidden;background:rgba(255,255,255,.04)}
.wg .wbr i{display:block;height:100%;border-radius:2px}
.win{position:absolute;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;z-index:5}
.wb{height:28px;display:flex;align-items:center;padding:0 8px;gap:6px;flex-shrink:0}
.wb .wd{display:flex;gap:4px}
.wb .wd i{width:8px;height:8px;border-radius:50%}
.wb .wt{font-size:10px;font-weight:600;flex:1;text-align:center;opacity:.6}
.wbd{flex:1;overflow:hidden;padding:10px}
.dkw{height:48px;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:10}
.dk{display:flex;gap:5px;border-radius:14px;padding:5px 10px}
.dk i{width:28px;height:28px;border-radius:8px;display:block}

/* icon colors */
.ic-chat{background:rgba(240,53,60,.15)}.ic-chat svg{stroke:#F0353C}
.ic-brain{background:rgba(67,224,166,.15)}.ic-brain svg{stroke:#43E0A6}
.ic-code{background:rgba(124,107,255,.15)}.ic-code svg{stroke:#7C6BFF}
.ic-browser{background:rgba(44,197,216,.15)}.ic-browser svg{stroke:#2CC5D8}
.ic-files{background:rgba(91,148,255,.15)}.ic-files svg{stroke:#5B94FF}
.ic-word{background:rgba(96,165,250,.15)}.ic-word svg{stroke:#60A5FA}
.ic-ppt{background:rgba(245,158,11,.15)}.ic-ppt svg{stroke:#F59E0B}
.ic-term{background:rgba(61,220,151,.15)}.ic-term svg{stroke:#3DDC97}
.ic-mail{background:rgba(240,119,182,.15)}.ic-mail svg{stroke:#F077B6}
.ic-agents{background:rgba(91,148,255,.15)}.ic-agents svg{stroke:#5B94FF}
.ic-gear{background:rgba(110,116,130,.15)}.ic-gear svg{stroke:#6E7482}
.ic-set{background:rgba(110,116,130,.15)}.ic-set svg{stroke:#6E7482}

/* ===== 1. LIQUID GLASS ===== */
.t1{background:#0a0a0f}
.t1 .bar{background:rgba(255,255,255,.04);backdrop-filter:blur(40px) saturate(1.8);border-bottom:1px solid rgba(255,255,255,.05)}
.t1 .bar .aname{color:rgba(255,255,255,.5)}
.t1 .dk{background:rgba(255,255,255,.05);backdrop-filter:blur(40px) saturate(1.8);border:1px solid rgba(255,255,255,.05)}
.t1 .dk i{background:rgba(255,255,255,.04)}
.t1 .wg{background:rgba(255,255,255,.035);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.05)}
.t1 .wg .wb{color:#fff}
.t1 .wg .wbr i{background:linear-gradient(90deg,#0EA5B7,#43E0A6)}
.t1 .win{background:rgba(255,255,255,.035);backdrop-filter:blur(28px) saturate(1.5);border:1px solid rgba(255,255,255,.06)}
.t1 .wb{background:rgba(255,255,255,.025);border-bottom:1px solid rgba(255,255,255,.04)}
.t1 .wb .wd i{background:rgba(255,255,255,.08)}.t1 .wb .wd i:nth-child(1){background:#FF5F57}.t1 .wb .wd i:nth-child(2){background:#FEBC2E}.t1 .wb .wd i:nth-child(3){background:#28C840}
.t1::before{content:"";position:absolute;top:-50px;right:-50px;width:200px;height:200px;background:conic-gradient(from 180deg,rgba(14,165,183,.1),rgba(124,107,255,.1),rgba(240,53,60,.06),rgba(14,165,183,.1));filter:blur(50px);border-radius:50%;pointer-events:none;z-index:0}
.t1 .tchat{background:rgba(255,255,255,.02);border-radius:8px;padding:8px;font-size:10px;color:rgba(255,255,255,.4);line-height:1.5;margin-bottom:6px}
.t1 .tchat b{color:#43E0A6}
.t1 .tmine{background:rgba(14,165,183,.05);border:1px solid rgba(14,165,183,.08);border-radius:8px;padding:8px;font-size:10px;color:rgba(255,255,255,.4);line-height:1.5;margin-left:24px;margin-bottom:6px}
.t1 .tinput{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:6px 10px;font-size:10px;color:rgba(255,255,255,.25);margin-top:auto}

/* ===== 2. AURORA ===== */
.t2{background:#050510}
.t2 .bar{background:linear-gradient(90deg,rgba(16,185,129,.08),rgba(59,130,246,.08),rgba(168,85,247,.08));border-bottom:1px solid rgba(255,255,255,.03);position:relative}
.t2 .bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#10B981,#3B82F6,#A855F7,#EC4899,#10B981);background-size:200% 100%;animation:as 4s linear infinite;opacity:.12}
@keyframes as{0%{background-position:0%}100%{background-position:200%}}
.t2 .bar .aname{color:rgba(255,255,255,.4);position:relative;z-index:1}
.t2 .bar .d,.t2 .bar .mi span,.t2 .bar .sr span{position:relative;z-index:1}
.t2 .ag{position:absolute;top:0;left:0;right:0;height:140px;background:linear-gradient(180deg,rgba(16,185,129,.08),rgba(59,130,246,.05),rgba(168,85,247,.03),transparent);filter:blur(30px);pointer-events:none;animation:ap 3s ease-in-out infinite alternate;z-index:0}
@keyframes ap{0%{opacity:.4}100%{opacity:.8}}
.t2 .star{position:absolute;width:1.5px;height:1.5px;background:#fff;border-radius:50%;animation:tw 2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.7}}
.t2 .dk{background:rgba(255,255,255,.03);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.03);position:relative;z-index:1}
.t2 .dk i{background:rgba(255,255,255,.03)}
.t2 .wg{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.03);backdrop-filter:blur(12px);position:relative;z-index:1}
.t2 .wg .wh span{color:rgba(16,185,129,.5)}
.t2 .wg .wb{background:linear-gradient(135deg,#10B981,#3B82F6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.t2 .wg .wbr i{background:linear-gradient(90deg,#10B981,#3B82F6)}
.t2 .win{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.03);backdrop-filter:blur(12px);position:relative;z-index:1}
.t2 .wb{background:rgba(255,255,255,.015);border-bottom:1px solid rgba(255,255,255,.03)}
.t2 .wb .wd i{background:rgba(255,255,255,.06)}.t2 .wb .wd i:nth-child(1){background:#FF5F57}.t2 .wb .wd i:nth-child(2){background:#FEBC2E}.t2 .wb .wd i:nth-child(3){background:#28C840}
.t2 .tchat{background:rgba(255,255,255,.015);border-radius:8px;padding:8px;font-size:10px;color:rgba(255,255,255,.35);line-height:1.5;margin-bottom:6px}
.t2 .tchat b{color:#10B981}
.t2 .tmine{background:rgba(16,185,129,.04);border:1px solid rgba(16,185,129,.06);border-radius:8px;padding:8px;font-size:10px;color:rgba(255,255,255,.35);line-height:1.5;margin-left:24px;margin-bottom:6px}
.t2 .tinput{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.03);border-radius:8px;padding:6px 10px;font-size:10px;color:rgba(255,255,255,.2);margin-top:auto}

/* ===== 3. CARBON ===== */
.t3{background:#111113}
.t3::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.006) 2px,rgba(255,255,255,.006) 4px),repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(255,255,255,.006) 2px,rgba(255,255,255,.006) 4px);pointer-events:none;z-index:0}
.t3 .bar{background:#1a1a1e;border-bottom:2px solid #FF3D00;position:relative;z-index:1}
.t3 .bar .aname{color:#FF3D00;font-family:'Roboto Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.t3 .bar .stripe{width:3px;height:12px;background:#FF3D00;border-radius:1px;flex-shrink:0}
.t3 .dk{background:#1a1a1e;border:1px solid rgba(255,61,0,.12);position:relative;z-index:1}
.t3 .dk i{background:rgba(255,61,0,.05);border:1px solid rgba(255,61,0,.08)}
.t3 .wg{background:#1a1a1e;border:1px solid rgba(255,61,0,.1);position:relative;z-index:1}
.t3 .wg .wh span{color:rgba(255,61,0,.4);font-family:'Roboto Mono',monospace;letter-spacing:.08em;font-size:8px}
.t3 .wg .wb{color:#FF3D00;font-family:'Roboto Mono',monospace}
.t3 .wg .ws{font-family:'Roboto Mono',monospace;font-size:9px;color:#555}
.t3 .wg .wbr{background:rgba(255,61,0,.06)}
.t3 .wg .wbr i{background:linear-gradient(90deg,#FF3D00,#FF6D00)}
.t3 .win{background:#1a1a1e;border:1px solid rgba(255,61,0,.1);position:relative;z-index:1}
.t3 .wb{background:#151517;border-bottom:2px solid rgba(255,61,0,.15)}
.t3 .wb .wd i{background:rgba(255,61,0,.1)}.t3 .wb .wd i:nth-child(1){background:#FF3D00}.t3 .wb .wd i:nth-child(2){background:#FF6D00}.t3 .wb .wd i:nth-child(3){background:#28C840}
.t3 .wb .wt{color:#FF3D00;font-family:'Roboto Mono',monospace;font-size:9px;letter-spacing:.04em}
.t3 .icl{font-family:'Roboto Mono',monospace;font-size:9px}
.t3 .tterm{font-family:'Roboto Mono',monospace;font-size:9px;line-height:1.5;padding:6px;background:#0d0d0f;border:1px solid rgba(255,61,0,.06);border-radius:4px}
.t3 .tterm .p{opacity:.4}.t3 .tterm .c{font-weight:500}.t3 .tterm .o{opacity:.5}

/* ===== 4. NEBULA ===== */
.t4{background:#0a0a1a}
.t4::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 15% 25%,rgba(124,107,255,.1),transparent 45%),radial-gradient(ellipse at 85% 55%,rgba(14,165,183,.08),transparent 45%),radial-gradient(ellipse at 50% 90%,rgba(245,158,11,.05),transparent 35%);filter:blur(40px);pointer-events:none;z-index:0;animation:nd 6s ease-in-out infinite alternate}
@keyframes nd{0%{transform:translate(0,0)}100%{transform:translate(6px,-5px)}}
.t4 .bar{background:rgba(255,255,255,.02);backdrop-filter:blur(16px);border-bottom:1px solid rgba(124,107,255,.08);position:relative;z-index:1}
.t4 .bar .aname{color:rgba(255,255,255,.4)}
.t4 .dk{background:rgba(255,255,255,.025);backdrop-filter:blur(16px);border:1px solid rgba(124,107,255,.06);position:relative;z-index:1}
.t4 .dk i{background:rgba(124,107,255,.05);border:1px solid rgba(124,107,255,.06)}
.t4 .wg{background:rgba(255,255,255,.02);border:1px solid rgba(124,107,255,.06);backdrop-filter:blur(12px);position:relative;z-index:1}
.t4 .wg .wh span{color:rgba(124,107,255,.5)}
.t4 .wg .wb{background:linear-gradient(135deg,#7C6BFF,#0EA5B7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.t4 .wg .wbr i{background:linear-gradient(90deg,#7C6BFF,#0EA5B7)}
.t4 .win{background:rgba(255,255,255,.02);border:1px solid rgba(124,107,255,.06);backdrop-filter:blur(12px);position:relative;z-index:1}
.t4 .wb{background:rgba(124,107,255,.03);border-bottom:1px solid rgba(124,107,255,.05)}
.t4 .wb .wd i{background:rgba(124,107,255,.08)}.t4 .wb .wd i:nth-child(1){background:#FF5F57}.t4 .wb .wd i:nth-child(2){background:#FEBC2E}.t4 .wb .wd i:nth-child(3){background:#28C840}
.t4 .tchat{background:rgba(255,255,255,.015);border-radius:8px;padding:8px;font-size:10px;color:rgba(255,255,255,.3);line-height:1.5;margin-bottom:6px}
.t4 .tchat b{color:#7C6BFF}
.t4 .tmine{background:rgba(124,107,255,.04);border:1px solid rgba(124,107,255,.06);border-radius:8px;padding:8px;font-size:10px;color:rgba(255,255,255,.3);line-height:1.5;margin-left:24px;margin-bottom:6px}
.t4 .tinput{background:rgba(255,255,255,.015);border:1px solid rgba(124,107,255,.05);border-radius:8px;padding:6px 10px;font-size:10px;color:rgba(255,255,255,.18);margin-top:auto}

/* ===== 5. BRUTALIST ===== */
.t5{background:#E8E4DE}
.t5 .bar{background:#fff;border-bottom:3px solid #111}
.t5 .bar .aname{color:#111;font-weight:800;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.t5 .dk{background:#fff;border:3px solid #111;box-shadow:4px 4px 0 #111}
.t5 .dk i{background:#f5f5f5;border:2px solid #111;border-radius:5px}
.t5 .wg{background:#fff;border:3px solid #111;box-shadow:4px 4px 0 #111}
.t5 .wg .wh span{color:#111;font-weight:800;letter-spacing:.08em}
.t5 .wg .wb{color:#FF3366}
.t5 .wg .ws{color:#666;font-weight:600}
.t5 .wg .wbr{background:#eee;border:1px solid #ddd}
.t5 .wg .wbr i{background:#00FF88}
.t5 .win{background:#fff;border:3px solid #111;box-shadow:5px 5px 0 #111}
.t5 .wb{background:#f5f5f5;border-bottom:3px solid #111}
.t5 .wb .wd i{border:2px solid #111}.t5 .wb .wd i:nth-child(1){background:#FF3366}.t5 .wb .wd i:nth-child(2){background:#FFD600}.t5 .wb .wd i:nth-child(3){background:#00FF88}
.t5 .wb .wt{color:#111;font-weight:800;font-size:9px;text-transform:uppercase}
.t5 .icl{color:#111;font-weight:700}
.t5 .icb{border:2px solid #111}
.t5 .tchat{background:#f5f5f5;border:2px solid #111;border-radius:0;padding:8px;font-size:10px;color:#111;line-height:1.5;margin-bottom:6px;font-weight:600}
.t5 .tchat b{color:#FF3366}
.t5 .tmine{background:#FFD600;border:2px solid #111;border-radius:0;padding:8px;font-size:10px;color:#111;line-height:1.5;margin-left:24px;margin-bottom:6px;font-weight:700}

/* ===== 6. LUXE ===== */
.t6{background:#000}
.t6 .bar{border-bottom:1px solid rgba(201,168,76,.12)}
.t6 .bar .aname{color:rgba(201,168,76,.4);font-family:'Playfair Display',serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.t6 .dk{border:1px solid rgba(201,168,76,.08)}
.t6 .dk i{background:rgba(201,168,76,.03);border:1px solid rgba(201,168,76,.06)}
.t6 .wg{border:1px solid rgba(201,168,76,.06);background:rgba(201,168,76,.01)}
.t6 .wg .wh span{color:rgba(201,168,76,.35);font-family:'Playfair Display',serif;letter-spacing:.1em}
.t6 .wg .wb{color:#C9A84C;font-family:'Playfair Display',serif}
.t6 .wg .ws{color:rgba(255,255,255,.2)}
.t6 .wg .wbr i{background:#C9A84C}
.t6 .win{background:rgba(201,168,76,.015);border:1px solid rgba(201,168,76,.08)}
.t6 .wb{border-bottom:1px solid rgba(201,168,76,.06)}
.t6 .wb .wd i{background:rgba(201,168,76,.1)}.t6 .wb .wd i:nth-child(1){background:rgba(201,168,76,.25)}.t6 .wb .wd i:nth-child(2){background:rgba(201,168,76,.15)}.t6 .wb .wd i:nth-child(3){background:#C9A84C}
.t6 .wb .wt{color:rgba(201,168,76,.4);font-family:'Playfair Display',serif;font-size:10px;letter-spacing:.08em}
.t6 .tchat{font-size:11px;color:rgba(255,255,255,.3);line-height:1.6;margin-bottom:6px;font-style:italic}
.t6 .tchat b{color:#C9A84C;font-style:normal}
.t6 .tlux{font-family:'Playfair Display',serif;font-size:14px;color:rgba(201,168,76,.6);font-weight:600;margin-bottom:6px}
.t6 .tdiv{width:30px;height:1px;background:#C9A84C;opacity:.2;margin:6px 0}

/* ===== 7. SYNTHWAVE ===== */
.t7{background:#1a0a2e}
.t7::after{content:"";position:absolute;bottom:48px;left:0;right:0;height:100px;background-image:repeating-linear-gradient(90deg,rgba(255,45,149,.1) 0px,transparent 1px,transparent 32px),repeating-linear-gradient(0deg,rgba(255,45,149,.1) 0px,transparent 1px,transparent 32px);transform:perspective(160px) rotateX(52deg);transform-origin:bottom;opacity:.25;pointer-events:none;z-index:0}
.t7 .bar{background:linear-gradient(90deg,rgba(255,45,149,.06),rgba(0,240,255,.06));border-bottom:2px solid rgba(255,45,149,.25);position:relative;z-index:1}
.t7 .bar .aname{color:#FF2D95;text-shadow:0 0 6px rgba(255,45,149,.35);font-weight:700}
.t7 .dk{background:rgba(255,45,149,.04);border:1px solid rgba(255,45,149,.1);box-shadow:0 0 12px rgba(255,45,149,.06);position:relative;z-index:1}
.t7 .dk i{background:rgba(255,45,149,.04);border:1px solid rgba(255,45,149,.08)}
.t7 .wg{background:rgba(255,45,149,.03);border:1px solid rgba(255,45,149,.08);box-shadow:0 0 12px rgba(255,45,149,.04);position:relative;z-index:1}
.t7 .wg .wh span{color:#00F0FF;text-shadow:0 0 4px rgba(0,240,255,.25)}
.t7 .wg .wb{background:linear-gradient(135deg,#FF2D95,#00F0FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 4px rgba(255,45,149,.2))}
.t7 .wg .wbr i{background:linear-gradient(90deg,#FF2D95,#00F0FF)}
